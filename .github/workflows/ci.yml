name: CI

on:
  push:
    branches: [main, 'feat/*', 'fix/*', 'chore/*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (${{ matrix.buildtype }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is currently 24.04, i.e. an *older* packaged fcitx5 than the one
        # the maintainer develops against (26.04). That gap is the point: a build that
        # only works on a bleeding-edge Fcitx5Core should fail here, not in an issue.
        os: [ubuntu-latest]
        buildtype: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ meson ninja-build git pkg-config \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev \
            libpulse-dev libebur128-dev libcurl4-openssl-dev \
            libspeexdsp-dev libsoxr-dev \
            pulseaudio
        # NOTE: no `libfcitx5-dev` meta package exists in Ubuntu — the fcitx5
        # development files ship as the four split packages above (verified on
        # jammy/noble/questing/resolute). libpulse-dev also provides the
        # libpulse-simple pkg-config file. Debian names may differ; send a patch.

      - name: Start a headless PulseAudio server
        run: |
          # Unit tests construct AudioCapture, which opens a real capture stream.
          # A null sink gives them something to record from in a headless runner.
          pulseaudio --daemonize=no --exit-idle-time=-1 --log-target=stderr &
          for i in $(seq 1 20); do pactl info >/dev/null 2>&1 && break; sleep 0.5; done
          pactl load-module module-null-sink sink_name=nextless_ci source_output=0 || true
          pactl info

      - name: Configure
        # -Dwerror stays ON (it is the project default): a new -Wall/-Wextra warning must fail CI.
        # Do not re-add -Wpedantic here — see the comment at the top of meson.build.
        run: meson setup build --buildtype=${{ matrix.buildtype }}

      - name: Build
        run: ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Staged install ships the packaged defaults
        # Guards the install rules themselves: if a config example stops being installed, or
        # is renamed out of the loader's view, that must fail here, not in a bug report.
        run: |
          DESTDIR="$PWD/stage" meson install -C build
          for name in doubao qwen audio nextless advanced hotwords; do
            f=$(find stage -path "*/nextless/$name.json" -type f | head -1)
            if [ -z "$f" ]; then
              echo "staged install is missing $name.json (looked under */nextless/)"
              exit 1
            fi
          done
          echo "all six packaged defaults are installed by the build"

      - name: Report test summary
        if: always()
        run: |
          if [ -f build/meson-logs/testlog.txt ]; then
            cat build/meson-logs/testlog.txt
          else
            echo "No test log: the build step failed before tests could run."
          fi

  deb-package:
    name: .deb installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the packaging toolchain only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper ca-certificates

      - name: Install build dependencies FROM debian/control
        # Issue #41. This job used to type the dependency list out by hand and
        # then run `dpkg-buildpackage -d`, which skips the dependency check - so
        # an incomplete control file stayed invisible in a green pipeline while
        # `apt build-dep`, sbuild and pbuilder failed at meson configure (the
        # build needs Fcitx5Module/Fcitx5Config/Fcitx5Utils, three packages
        # beyond libfcitx5core-dev). control is now the only source of truth: a
        # dependency added in meson.build but not listed here breaks this job,
        # the same way it breaks a sponsor's build.
        run: |
          rm -rf /tmp/pkgsrc && mkdir -p /tmp/pkgsrc
          tar -C . --exclude=.git --exclude=build --exclude=obj-\* \
              --exclude=stage-\* --exclude=debian/.debhelper \
              -cf - . | tar -C /tmp/pkgsrc -xf -
          cd /tmp/pkgsrc
          sudo apt-get build-dep -y ./

      - name: Build the package
        # Built in a copy: dpkg-buildpackage would otherwise see the checkout's
        # untracked build/ and obj-* dirs as source, and run a nested build in
        # whatever buildtype they were left in. No `-d` - the dependency check
        # is the point of the job.
        run: |
          cd /tmp/pkgsrc
          dpkg-buildpackage -us -uc -b -jauto
          dpkg-deb -I /tmp/fcitx5-nextless_*_amd64.deb | grep -E "^ (Package|Depends)"

      - name: Install the built .deb into this clean runner
        run: |
          sudo dpkg -i /tmp/fcitx5-nextless_*_amd64.deb || sudo apt-get install -fy
          test -f /usr/share/fcitx5/addon/nextless.conf
          test -f /usr/lib/*/fcitx5/nextless.so
          test -x /usr/bin/nextless-get-models
          test -f /etc/nextless/hotwords.json
          ldd /usr/lib/*/fcitx5/nextless.so | grep -q "not found" && { echo "unresolved libs"; exit 1; } || true
          echo "add-on payload lands where fcitx5 scans"

      - name: Remove it again
        run: |
          sudo dpkg -r fcitx5-nextless
          if dpkg-query -W fcitx5-nextless >/dev/null 2>&1; then
            [ "$(dpkg-query -W -f='${Status}' fcitx5-nextless)" = "deinstall ok config-files" ] || {
              echo "package not cleanly deinstalled"; exit 1; }
          fi
          test ! -e /usr/share/fcitx5/addon/nextless.conf
          test ! -e /usr/bin/nextless-get-models
          sudo dpkg -P fcitx5-nextless
          test ! -e /etc/nextless/advanced.json
          echo "remove + purge leave no payload debris"

      - name: Upload Meson logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.os }}-${{ matrix.buildtype }}
          path: build/meson-logs/
          if-no-files-found: ignore

  diagnostics-configuration:
    name: opt-in diagnostics still compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ meson ninja-build git pkg-config \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev \
            libpulse-dev libebur128-dev libcurl4-openssl-dev \
            libspeexdsp-dev libsoxr-dev
      - name: Configure with NEXTLESS_DIAGNOSTICS_ENABLED
        run: meson setup build-diag -Ddiagnostic_logging=true
      - name: Build
        run: ninja -C build-diag
